server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: marketplace-app-auth-service
          uri: lb://marketplace-app-auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: marketplace-app-analytics-service
          uri: lb://marketplace-app-analytics-service
          predicates:
            - Path=/api/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analyticsServiceCircuitBreaker
                fallbackUri: forward:/fallback/analytics

        - id: marketplace-app-product-service
          uri: lb://marketplace-app-product-service
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/product

        - id: marketplace-app-order-service
          uri: lb://marketplace-app-order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order

        - id: marketplace-app-payment-service
          uri: lb://marketplace-app-payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        - id: marketplace-app-product-service-docs
          uri: lb://marketplace-app-product-service
          predicates:
            - Path=/marketplace-app-product-service/v3/api-docs
          filters:
            - name: StripPrefix
              args:
                parts: 1

        - id: marketplace-app-order-service-docs
          uri: lb:/marketplace-app-/order-service
          predicates:
            - Path=/marketplace-app-order-service/v3/api-docs
          filters:
            - name: StripPrefix
              args:
                parts: 1

        - id: marketplace-app-payment-service-docs
          uri: lb://marketplace-app-payment-service
          predicates:
            - Path=/marketplace-app-payment-service/v3/api-docs
          filters:
            - name: StripPrefix
              args:
                parts: 1

        - id: marketplace-app-auth-service-docs
          uri: lb://marketplace-app-auth-service
          predicates:
            - Path=/marketplace-app-auth-service/v3/api-docs
          filters:
            - name: StripPrefix
              args:
                parts: 1


    circuitbreaker:
      resilience4j:
        instances:
          authServiceCircuitBreaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 5000
            sliding-window-size: 10
          productServiceCircuitBreaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 5000
          orderServiceCircuitBreaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 5000
          bankAccountCircuitBreaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 5000
          analyticsServiceCircuitBreaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 5000


eureka:
  client:
    service-url:
      defaultZone: http://marketplace-app-eureka-server:8761/eureka
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      http.server.requests: true
      tomcat: true
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    urls:
      - name: marketplace-app-payment-service
        url: /marketplace-app-payment-service/v3/api-docs
      - name: marketplace-app-order-service
        url: /marketplace-app-order-service/v3/api-docs
      - name: marketplace-app-product-service
        url: /marketplace-app-product-service/v3/api-docs
      - name: marketplace-app-auth-service
        url: /marketplace-app-auth-service/v3/api-docs
      - name: marketplace-app-analytics-service
        url: /marketplace-app-analytics-service/v3/api-docs

    path: /swagger-ui.html

security:
  open-endpoints:
    - /marketplace-app-product-service/v3/api-docs
    - /marketplace-app-order-service/v3/api-docs
    - /marketplace-app-payment-service/v3/api-docs
    - /marketplace-app-auth-service/v3/api-docs
    - /marketplace-app-analytics-service/v3/api/docs
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /api/auth/login
    - /api/auth/register
    - /api/analytics/stats
    - /actuator/health



logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: DEBUG