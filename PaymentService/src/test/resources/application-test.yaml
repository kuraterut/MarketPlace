eureka:
  client:
    enabled: false

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    properties:
      enable.auto.commit: false

    listener:
      auto-startup: false

  task:
    scheduling:
      enabled: false

# Disable gRPC server in tests
grpc:
  server:
    enabled: false
    port: 0  # Use random port

# Disable actuator health checks
management:
  health:
    grpc:
      enabled: false
    defaults:
      enabled: false
  endpoint:
    health:
      enabled: false
      show-details: never