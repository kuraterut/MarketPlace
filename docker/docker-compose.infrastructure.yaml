services:
  #БД
  postgres-auth:
    image: postgres:latest
    container_name: ${POSTGRES_NAME_AUTH}
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - marketplace-net


  postgres-product:
    image: postgres:latest
    container_name: ${POSTGRES_NAME_PRODUCT}
    environment:
      - POSTGRES_DB=product_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    networks:
      - marketplace-net

  postgres-payment:
    image: postgres:latest
    container_name: ${POSTGRES_NAME_PAYMENT}
    environment:
      - POSTGRES_DB=payment_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - marketplace-net

  postgres-order:
    image: postgres:latest
    container_name: ${POSTGRES_NAME_ORDER}
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - marketplace-net

  #TODO Добавить кликхаус и сервис аналитики в Helm
  clickhouse-analytics:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-analytics
    hostname: clickhouse-analytics
    ports:
      - "8123:8123"   # HTTP интерфейс
      - "9000:9000"   # Native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: kuraterut
      CLICKHOUSE_PASSWORD: kuraterut
      CLICKHOUSE_DB: analytics
    volumes:
      - clickhouse_analytics_data:/var/lib/clickhouse
      - ../AnalyticsService/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql
    networks:
      - marketplace-net

  #KEYDB
  keydb-product:
    image: eqalpha/keydb:latest
    container_name: keydb-product
    hostname: keydb-product
    ports:
      - "6380:6379"
    volumes:
      - keydb_product_data:/data
    networks:
      - marketplace-net
    command: keydb-server --appendonly yes --save "" --bind 0.0.0.0

  keydb-payment:
    image: eqalpha/keydb:latest
    container_name: keydb-payment
    hostname: keydb-payment
    ports:
      - "6381:6379"
    volumes:
      - keydb_payment_data:/data
    networks:
      - marketplace-net
    command: keydb-server --appendonly yes --save "" --bind 0.0.0.0

  keydb-order:
    image: eqalpha/keydb:latest
    container_name: keydb-order
    hostname: keydb-order
    ports:
      - "6382:6379"
    volumes:
      - keydb_order_data:/data
    networks:
      - marketplace-net
    command: keydb-server --appendonly yes --save "" --bind 0.0.0.0


  #KAFKA
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - marketplace-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  marketplace-app-kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: marketplace-app-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - marketplace-net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://marketplace-app-kafka:9092,PLAINTEXT_EXT://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXT://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

volumes:
  postgres_auth_data:
  postgres_product_data:
  postgres_payment_data:
  postgres_order_data:
  postgres_bank_account_data:
  keydb_product_data:
  keydb_payment_data:
  keydb_order_data:
  clickhouse_analytics_data:

networks:
  marketplace-net:
    name: marketplace-net
    driver: bridge
    external: true