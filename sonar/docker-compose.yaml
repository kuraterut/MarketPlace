services:
  postgres-sonar:
    image: postgres:latest
    container_name: postgres-sonar
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      postgres-sonar:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Для разработки отключим строгие ES-проверки:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET / HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && grep -q 'SonarQube' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - marketplace-net

volumes:
  sonardb_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  marketplace-net:
    external: true