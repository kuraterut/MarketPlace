services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - marketplace-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - marketplace-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: marketplace-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem # Хранить трейсы в памяти (для разработки). Для prod смотрите другие опции (elasticsearch, cassandra)
    networks:
      - marketplace-net

volumes:
  grafana-data:

networks:
  marketplace-net:
    external: true